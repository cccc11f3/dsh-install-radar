# dsh-install-radar bundle patch: 注册插件行。
# 宿主半部分注册四个工具（report / sessions / baseline / diff），无客户端界面，
# 不改动任何官方 UI 与配置。
- insert:
    - id: install-radar
      name: 'dsh-install-radar'
      config:
        # 额外要盯的目录（例如 E:\AI、D:\ComfyUI）
        extraRoots: []
        # 是否使用内置默认根（Program Files / winget / npm 全局 / pip 用户包 / conda …）
        includeDefaults: true
        # 会话扫描上限，0 = 全部
        maxSessions: 0
